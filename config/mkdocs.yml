site_name: APEX Documentation
site_description: Unified user and developer documentation for APEX products (DS, DX, GageMap, DX+, and Custom Development APIs).
repo_url: https://github.com/Apex-Turbine/ApexDocs
repo_name: Apex-Turbine/ApexDocs

docs_dir: ..
site_dir: ../dist/site
use_directory_urls: false

theme:
  name: material
  logo: assets/images/apex-logo-dark.svg
  favicon: assets/images/apex-favicon.svg
  font:
    text: Red Hat Text
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - offline

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/apex.css

extra_javascript:
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  azure-pipelines.yml
  staticwebapp.config.json
  requirements.txt
  build_docs.py
  build.ps1
  build.sh
  config/
  build/
  dist/
  site/
  deployment/
  **/CMakeLists.txt
  **/*.dpd
  **/*.xlsx
  **/*.i

nav:
  - Overview: README.md
  - Index: DOC_INDEX.md
  - DS:
      - Quick Start: DS/quick-start.md
      - DS Suite Overview: DS/README.md
      - APEX DS: DS/DS/README.md
      - APEX DR: DS/DR/README.md
      - APEX DM: DS/DM/README.md
      - APEX DO: DS/DO/README.md
      - Hardware Drivers: DS/Drivers/README.md
  - DX:
      - Quick Start: DX/quickstart.md
      - DX Overview: DX/README.md
      - Licensing: DX/licensing.md
      - Designer: DX/design.md
      - Viewer: DX/view.md
